# Joins the network of the Caddy that already answers on ports 80 and 443.
services:
  volumora-sync:
    build: .
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://fouad-boudouhi.de
    volumes:
      - data:/data
    networks:
      - proxy
    mem_limit: 256m
volumes:
  data:
networks:
  proxy:
    external: true
    name: deploy_default
