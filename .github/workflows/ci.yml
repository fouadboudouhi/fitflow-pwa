name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Pinned: Playwright 1.56 cannot install its browser dependencies on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
